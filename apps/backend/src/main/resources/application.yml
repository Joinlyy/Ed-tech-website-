# Default profile — production-shaped config, backed by env vars.
# For dev (H2, no Docker) use: `--spring.profiles.active=dev` (see application-dev.yml)
spring:
  application:
    name: redpen-backend
  datasource:
    # All three come from the environment — never commit real values.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/redpen}
    username: ${SPRING_DATASOURCE_USERNAME:redpen}
    password: ${SPRING_DATASOURCE_PASSWORD:redpen}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10        # Aiven free tier caps at 20 total; leave headroom.
      minimum-idle: 2
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns schema, JPA only validates.
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ── Logging ─────────────────────────────────────────────────────────────
# Framework loggers stay at WARN so boot output is short. Our own package and
# the one-liner "app started / listening on port / migrations applied" stay INFO.
logging:
  level:
    root: WARN
    com.redpen: INFO
    org.springframework.boot.web.embedded.tomcat.TomcatWebServer: INFO
    org.flywaydb.core.internal.command.DbMigrate: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{25} - %msg%n"

redpen:
  admin:
    secret-key: ${REDPEN_ADMIN_SECRET_KEY:RedPenKingAdminSecret2026!}
  security:
    jwt:
      secret: ${REDPEN_SECURITY_JWT_SECRET:change-me-in-production-this-must-be-at-least-32-chars-long}
      ttl-hours: ${REDPEN_SECURITY_JWT_TTL_HOURS:24}
    # Google OAuth 2.0 client id. Backend verifies the ID token against Google's JWKS.
    google:
      client-id: ${REDPEN_GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${REDPEN_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  payments:
    provider: ${REDPEN_PAYMENTS_PROVIDER:STUB}   # STUB | RAZORPAY | STRIPE
    razorpay:
      key-id: ${REDPEN_PAYMENTS_RAZORPAY_KEY_ID:${RAZORPAY_KEY_ID:}}
      key-secret: ${REDPEN_PAYMENTS_RAZORPAY_KEY_SECRET:${RAZORPAY_KEY_SECRET:}}
      webhook-secret: ${REDPEN_PAYMENTS_RAZORPAY_WEBHOOK_SECRET:${RAZORPAY_WEBHOOK_SECRET:}}
  gemini:
    api-key: ${GEMINI_API_KEY:}
